<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SkillSwap MINT Styleguide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main>
    <header class="dashboard-heading">
      <div><p class="eyebrow">DESIGN SYSTEM / 01</p><h1>MINT components</h1></div>
      <button class="icon-button" type="button" data-theme-toggle>◐</button>
    </header>

    <section style="display:grid;gap:24px">
      <article class="panel" style="padding:24px">
        <p class="eyebrow">BUTTONS</p>
        <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:16px">
          <button class="button button-primary">Primary action</button>
          <button class="button button-secondary">Secondary</button>
          <button class="button button-ghost">Ghost</button>
          <button class="button button-danger">Danger</button>
          <button class="button button-primary" disabled><span class="coin-spinner"></span> Loading</button>
        </div>
      </article>

      <article class="panel" style="padding:24px">
        <p class="eyebrow">CARDS / BADGES / COINS</p>
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:16px">
          <span class="role-sticker">TEACH</span>
          <span class="role-sticker admin">ADMIN</span>
          <span class="avatar">SK</span>
          <span class="coin-wallet"><span class="mini-coin"></span><span><strong>125</strong> <small>SC</small></span></span>
        </div>
      </article>

      <article class="panel" style="padding:24px">
        <p class="eyebrow">FORM CONTROLS</p>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:16px">
          <label>Text input<input type="text" placeholder="Type here" /></label>
          <label>Select<select><option>JavaScript</option></select></label>
          <label>Date &amp; time<input type="datetime-local" /></label>
          <label>Textarea<textarea placeholder="Session notes"></textarea></label>
        </div>
      </article>

      <article class="panel" style="padding:24px">
        <p class="eyebrow">TABS / TICKET / RECEIPT</p>
        <nav class="dashboard-tabs" aria-label="Example tabs">
          <button class="dashboard-tab active" type="button"><span class="tab-index">01</span>Skills</button>
          <button class="dashboard-tab" type="button"><span class="tab-index">02</span>Match</button>
        </nav>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:16px">
          <div class="panel" style="padding:16px"><strong>BOOKED</strong><br /><span class="mono">#1042 · 60 min · 25 SC</span></div>
          <div class="panel" style="padding:16px"><span class="eyebrow">RECEIPT</span><hr /><span class="mono">SESSION #1042<br />COMPLETED<br />25 SC</span></div>
        </div>
      </article>

      <article class="panel" style="padding:24px">
        <p class="eyebrow">LOADING / EMPTY / ERROR</p>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:16px">
          <div class="panel" style="padding:16px"><div style="height:14px;background:var(--muted);opacity:.25;margin-bottom:8px"></div><div style="height:14px;width:70%;background:var(--muted);opacity:.25"></div></div>
          <div class="panel" style="padding:16px;text-align:center"><strong>No sessions yet</strong><p>Add your first booking.</p></div>
          <div class="panel" style="padding:16px;background:var(--coral)!important;color:#fff"><strong>Could not load data</strong><button class="button button-ghost" type="button" style="margin-top:8px;color:#fff">Retry</button></div>
        </div>
      </article>
    </section>
  </main>
  <script src="/js/mint.js"></script>
</body>
</html>
